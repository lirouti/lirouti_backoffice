name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["기능"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능에 대해서 설명해주세요.
  - type: textarea
    id: context
    attributes:
      label: 기능
      description: 어떤 기능인가요?
      placeholder: 추가됐으면 하는 기능을 설명해주세요! (화면, 컴포넌트, 도메인 규칙 등)
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 이 기능이 왜 필요한가요?
      description: 어떤 문제를 해결하거나 불편함을 개선하나요?
      placeholder: 현재 어떤 점이 불편한지 알려주세요!
    validations:
      required: false
  - type: input
    id: design
    attributes:
      label: 디자인 원본
      description: 대조할 디자인 파일이 있다면 적어주세요 (Claude Design "리루티" 의 파일명)
      placeholder: "riruti-admin-items.dc.html"
    validations:
      required: false
