name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        버그 제보를 해주세요
  - type: checkboxes
    id: duplicated-check
    attributes:
      label: 이미 제보된 버그인가요?
      description: 이미 제보된 이슈인지 확인해주세요!
      options:
        - label: 제보된 버그인지 찾아봤습니다.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 버그인가요?
      description: 기대되는 동작은 무엇인지 설명해주세요
      placeholder: 버그에 대해서 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 재현 방법
      description: 어느 화면에서 무엇을 눌렀는지 순서대로 알려주세요 (경로 포함)
      placeholder: |
        1. /items 로 이동
        2.
        3.
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 환경
      description: 브라우저와 테마를 적어주세요. 탭을 여러 개 열어둔 상태였는지도 도움이 됩니다.
      placeholder: "Chrome 141 · 다크 모드 · 탭 5개 열림"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 콘솔 에러 / 스택 트레이스
      description: 브라우저 개발자도구 콘솔에 찍힌 내용이 있다면 붙여넣어주세요
      render: shell
    validations:
      required: false
