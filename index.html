<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>리루티 운영 어드민</title>

    <!--
      ⚠️ **색인 금지.** 로그인 뒤 운영 어드민이라 검색에 뜰 이유가 없고, 목 로그인이
      아무나 통과시키는 데모 배포에서는 위험만 남는다 (docs/ARCHITECTURE.md §9.4).
      `vercel.json` 의 `X-Robots-Tag` 헤더가 같은 말을 한다 — 크롤러마다 보는 것이 달라
      둘을 함께 둔다.

      ⚠️ **`robots.txt` 로 막지 않는다.** 크롤링을 막으면 이 태그를 못 읽어서 오히려
      URL 만 색인될 수 있다. 자세한 것은 `public/robots.txt` 의 주석.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      FOUC 방지: zustand persist 는 React 마운트 이후에 읽힌다.
      그 전에 흰 화면이 번쩍이므로 여기서 data-theme 을 먼저 세팅한다.
      키는 src/stores/themeStore.ts 의 THEME_KEY 와 반드시 일치해야 한다.
    -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('riruti_admin_theme_v1'))
        document.documentElement.dataset.theme = s?.state?.theme === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>

    <!--
      Pretendard — **self-host**. 파일은 `public/fonts/`, 만드는 것은 `bun run font`
      (docs/ARCHITECTURE.md §61).

      ⚠️ **CDN 이었을 때 두 가지가 깨져 있었다.**

      ① **폰트가 한 글자도 안 쓰이고 있었다.** CDN 이 선언하는 이름은
         `Pretendard Variable` 인데 우리 토큰(`sans`)은 `Pretendard` 를 요구한다 —
         어디에도 없는 이름이라 첫 커밋 이후 줄곧 `-apple-system` 으로 떨어졌다.
         측정: 같은 글에서 폭 375.94px(그때) 대 380.51px(Pretendard 강제).

      ② **SRI 가 고정할 수 없는 파일에 걸려 있었다.** jsDelivr 가 clean-css 로 **동적
         생성**하는 파일이라 그쪽이 파일 안에 「Do NOT use SRI with dynamically
         generated files!」 라고 적어 두었다. minifier 가 바뀌면 해시가 어긋나 CSS 가
         통째로 거부되고 폰트가 사라진다. 게다가 SRI 는 CSS 만 덮어서, 그 CSS 가 부르는
         woff2 2.0MB 는 애초에 검증되지 않았다.

      self-host 는 셋을 한 번에 닫는다 — 이름을 우리가 정하고, 외부 요청이 0이 되고,
      폐쇄망에서도 뜬다.

      ⚠️ **`<link>` 로 둔다.** `src/` 에서 import 하면 JS 번들을 기다리므로 글자가 늦게
         제 모습을 갖춘다.
    -->
    <link rel="stylesheet" href="/fonts/pretendard.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
