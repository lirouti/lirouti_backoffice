<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>리루티 운영 어드민</title>

    <!--
      ⚠️ **색인 금지.** 로그인 뒤 운영 어드민이라 검색에 뜰 이유가 없고, 목 로그인이
      아무나 통과시키는 데모 배포에서는 위험만 남는다 (docs/ARCHITECTURE.md §9.4).
      `vercel.json` 의 `X-Robots-Tag` 와 `public/robots.txt` 가 같은 말을 한다 —
      크롤러마다 보는 것이 달라 셋을 함께 둔다.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      FOUC 방지: zustand persist 는 React 마운트 이후에 읽힌다.
      그 전에 흰 화면이 번쩍이므로 여기서 data-theme 을 먼저 세팅한다.
      키는 src/stores/themeStore.ts 의 THEME_KEY 와 반드시 일치해야 한다.
    -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('riruti_admin_theme_v1'))
        document.documentElement.dataset.theme = s?.state?.theme === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>

    <!--
      Pretendard — 지금은 CDN.

      `/gh/` 경로는 GitHub 저장소의 **태그를 그대로** 서빙한다. 태그는 옮길 수 있으므로
      같은 URL 이 다른 내용을 줄 수 있고, 어드민 로그인 화면에 임의 CSS 가 들어오면
      폼 위에 가짜를 덮거나 속성 선택자 + background-image 로 값을 새어 보낼 수 있다.
      그래서 **SRI 로 바이트를 고정**한다 — 내용이 1비트라도 바뀌면 브라우저가 거부한다.
      (cross-origin 에 SRI 를 걸려면 `crossorigin` 이 함께 있어야 한다.)

      ⚠️ SRI 는 이 CSS 만 고정한다. CSS 가 상대경로로 부르는 woff2(2.0MB)는 못 덮는다.
         완전히 닫으려면 self-host 여야 한다 — 폐쇄망 요구와 함께 처리한다.
         TODO(docs/ARCHITECTURE.md §11-3)
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
      integrity="sha384-f9iEnfDmuRSuBrXQjpPibejnfJMrZ2yI+715EjxlzBsPFIpaD1NxMh1MIzthxtCh"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
